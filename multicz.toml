# multicz.toml - versioning, changelog and tagging for the single obd-tui
# component. Driven by Conventional Commits.
# Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
# The repository history was restarted and carries no release tag, so the
# first release computes its version from the whole history. Keep the
# v-prefixed convention the project published under.
tag_format = "v{version}"
initial_version = "0.0.0"
# Regenerate uv.lock after each bump so the lockfile tracks the new
# version. Without `allow`, multicz silently skips the hook and the next
# `uv sync --frozen` in CI fails on lockfile drift.
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"
deprecate = "minor"
remove = "minor"

# CHANGELOG layout aligned on Keep-a-Changelog. multicz routes each commit
# to the section whose `types` list contains its type; sections render in
# declaration order.
[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Deprecated"
types = ["deprecate"]

[[project.changelog_sections]]
title = "Removed"
types = ["remove"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[components.obd-tui]
# A commit counts toward the bump and the CHANGELOG only if it touches one
# of these paths: the source, the project/deps/metadata file, and what
# turns them into a Debian package. The packaging is tracked because it
# shapes an artifact users install - a fix to how the .deb is built changes
# what they get, and can only reach them as a new version, since the
# archive binds a tarball to its version for good.
#
# Everything else (LICENSE, README, .github, docs, tests, tooling configs)
# is intentionally NOT tracked, so infrastructure or docs work never
# triggers a release.
paths = ["src/**", "pyproject.toml", "debian/**", "scripts/build-deb.sh"]
bump_files = [
    { file = "pyproject.toml", key = "project.version" },
    { file = "src/obd_tui/__init__.py", key = "regex:__version__\\s*=\\s*[\"']([^\"']+)[\"']" },
]
changelog = "CHANGELOG.md"
post_bump = ["uv lock"]

# Distribution: PyPI, published by CI through Trusted Publishing.
[[components.obd-tui.artifacts]]
type = "pypi"
ref = "obd-tui=={version}"

# Distribution: a Launchpad PPA. multicz owns debian/changelog the same way
# it owns CHANGELOG.md - it prepends a stanza with the release's bullets on
# every bump, and the file is joined to the release commit. It writes one
# stanza with one distribution; scripts/build-deb.sh re-headers that stanza
# per Ubuntu series (0.2.0-1~noble1 and so on), because a PPA needs a
# separate upload for each.
[[components.obd-tui.writers]]
type = "debian-changelog"
file = "debian/changelog"
distribution = "unstable"
urgency = "medium"
maintainer = "Chris <goabonga@pm.me>"
debian_revision = 1

# `docs` is a release-tracked component for the Zensical site. It ships
# no artifact - the "release" is the GitHub Pages deploy - but giving
# the site a version and a tag is what lets `multicz changed` and
# `multicz plan` answer "did the docs move?" the same tag-aware way they
# answer it for the package, which is what the `docs` CI job gates on.
#
# `tag_format` is overridden because the project-level format is the
# unprefixed `v{version}` the package publishes under: without this the
# two components would fight over the same tag namespace.
#
# `depends_on` the package so a code release also cascades a docs patch:
# the site embeds version numbers and changelog content, so a package
# bump invalidates the rendered output even when no markdown file was
# touched.
#
# `bump_rules` here MERGES into `[project.bump_rules]`, adding `docs` on
# top of the inherited feat/fix/perf/revert/deprecate/remove. A `docs:`
# commit therefore bumps this component and nothing else - obd-tui
# inherits the project rules, where `docs` is absent.
#
# No `changelog`: the site's history is the git log, and routing docs
# patches into CHANGELOG.md would mix them into what users read as the
# package's release notes.
[components.docs]
paths = ["docs/**", "zensical.toml"]
tag_format = "docs-v{version}"
bump_files = [
    { file = "zensical.toml", key = "project.extra.versions.docs" },
]
depends_on = ["obd-tui"]
bump_rules = { docs = "patch" }
