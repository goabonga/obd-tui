name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A PPA needs uploads a release does not: a first publication, a series
  # added later, a rejected signature, a build Launchpad lost.
  workflow_dispatch:
    inputs:
      ppa:
        description: Upload the current version to the PPA
        type: boolean
        default: false
      skip_orig:
        description: >-
          Leave the upstream tarball out, for a version the archive already
          holds (a re-upload after one series went through)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check --output-format=github src tests
      - run: uv run --no-sync ruff format --check src tests

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run --no-sync mypy src

  license-headers:
    name: license-headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - name: Check SPDX headers
        run: |
          uv run --no-project python scripts/add_license_header.py --path src --types py --check
          uv run --no-project python scripts/add_license_header.py --path tests --types py --check
          uv run --no-project python scripts/add_license_header.py --path scripts --types py,sh --check
          uv run --no-project python scripts/add_license_header.py --path .github --types yml --check
          uv run --no-project python scripts/add_license_header.py --path . --types toml --check

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - name: Run tests with coverage
        run: |
          uv run --no-sync pytest \
            --cov=obd_tui \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@v7
        with:
          files: junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml --recursive src

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uvx pip-audit --skip-editable --path .venv

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OSV-Scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: osv-scanner scan source --lockfile=uv.lock

  release:
    name: release
    needs: [lint, type-check, license-headers, test, bandit, pip-audit, osv-scanner]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      # No python-version pin: multicz needs Python >=3.12 and
      # `uv tool install multicz` fails under 3.11.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        run: |
          NAME="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      - name: Plan release
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag, push (signed)
        id: bump_signed
        if: steps.gpg.outputs.available == 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump --commit --tag --push --sign --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | keys | join(" ")')
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
            echo "version=$(uv tool run multicz get obd-tui)" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump, commit, tag, push
        id: bump_unsigned
        if: steps.gpg.outputs.available != 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump --commit --tag --push --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | keys | join(" ")')
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
            echo "version=$(uv tool run multicz get obd-tui)" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve release outputs
        id: bump
        run: |
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            echo 'no_bumps=${{ steps.bump_signed.outputs.no_bumps }}' >> "$GITHUB_OUTPUT"
            echo 'version=${{ steps.bump_signed.outputs.version }}' >> "$GITHUB_OUTPUT"
          else
            echo 'no_bumps=${{ steps.bump_unsigned.outputs.no_bumps }}' >> "$GITHUB_OUTPUT"
            echo 'version=${{ steps.bump_unsigned.outputs.version }}' >> "$GITHUB_OUTPUT"
          fi

  pypi-publish:
    name: pypi-publish
    needs: [release]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.release.result == 'success' && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/obd-tui/
    permissions:
      contents: write
      id-token: write   # Trusted Publishing (OIDC) - do NOT add a token/password
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Build wheel and sdist
        run: uv build --out-dir dist && ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          # Same tag multicz created (tag_format = "v{version}").
          tag="v${version}"
          notes=$(uv tool run multicz release-notes --tag "$tag")
          gh release create "$tag" --title "$tag" --notes "$notes" dist/*

  docs:
    name: docs
    needs: [release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical (doc group)
        run: uv sync --frozen --only-group doc
      - name: Build site
        run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  ppa-upload:
    name: ppa-upload
    needs: [test, release]
    # After a release, or on demand. `!cancelled()` so the manual path is
    # still evaluated when `release` is skipped, and the test gate is kept
    # either way: nothing reaches the archive untested.
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && (
        (github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.release.result == 'success'
          && needs.release.outputs.no_bumps == 'false')
        || (github.event_name == 'workflow_dispatch' && inputs.ppa)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            {
              echo "## PPA upload: skipped"
              echo ""
              echo "GPG_PRIVATE_KEY and/or GPG_PASSPHRASE are not configured."
              echo "Launchpad only accepts signed uploads."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GPG secrets unset; not uploading to the PPA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.gpg.outputs.skip != 'true'
        with:
          # The release commit multicz just pushed, which carries the bumped
          # version and the debian/changelog stanza that goes with it.
          ref: main
      - uses: astral-sh/setup-uv@v7
        if: steps.gpg.outputs.skip != 'true'
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.11"
      - name: Install the packaging tools
        if: steps.gpg.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            devscripts dput dpkg-dev python3-pip
      - name: Export the pinned runtime requirements
        if: steps.gpg.outputs.skip != 'true'
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --no-annotate --no-hashes -o debian/requirements.txt
          cat debian/requirements.txt
      - name: Import and unlock the signing key
        id: key
        if: steps.gpg.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # debsign drives gpg without a terminal: allow the passphrase to
          # come from the batch below and keep the agent warm for the three
          # signatures that follow.
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' \
            > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo warm-the-agent | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "id=$KEY_ID" >> "$GITHUB_OUTPUT"
      - name: Build the source packages
        if: steps.gpg.outputs.skip != 'true'
        env:
          SIGN_KEY: ${{ steps.key.outputs.id }}
          SKIP_ORIG: ${{ inputs.skip_orig && '1' || '0' }}
          DEBFULLNAME: Chris
          DEBEMAIL: goabonga@pm.me
        run: scripts/build-deb.sh
      - name: Upload to the PPA
        if: steps.gpg.outputs.skip != 'true'
        run: |
          set -uo pipefail
          # No credentials: Launchpad authenticates the upload by the
          # signature on the .changes, and the key must be registered on the
          # account for it to be accepted.
          #
          # The anonymous FTP endpoint returns a 550 often enough to be
          # worth retrying, and one series failing must not strand the
          # others: every upload is attempted, and the step fails at the end
          # if any of them never went through. -f on a retry bypasses the
          # .upload log dput writes for files it already sent.
          # Every series in one dput run: the anonymous FTP endpoint has
          # accepted the first upload and refused the next one with a 550
          # in every run so far, whether or not the tarball travelled with
          # it, and whether the retry came 30 seconds or minutes later. One
          # session sends them all.
          changes=(../build-area/obd-tui_*_source.changes)
          printf 'uploading %s\n' "${changes[@]##*/}"

          for attempt in 1 2 3; do
            if [ "$attempt" -eq 1 ]; then
              dput ppa:goabonga/obd-tui "${changes[@]}" && exit 0
            else
              # -f bypasses the .upload log dput writes for what it sent.
              dput -f ppa:goabonga/obd-tui "${changes[@]}" && exit 0
            fi
            echo "::warning::upload attempt $attempt failed"
            sleep 60
          done

          echo "::error::the upload never went through"
          exit 1
      - name: Write step summary
        if: steps.gpg.outputs.skip != 'true' && success()
        run: |
          {
            echo "## PPA upload"
            echo ""
            echo "Sent to \`ppa:goabonga/obd-tui\`:"
            echo ""
            for changes in ../build-area/obd-tui_*_source.changes; do
              echo "- \`${changes##*/}\`"
            done
            echo ""
            echo "Launchpad builds the binaries; watch them at"
            echo "<https://launchpad.net/~goabonga/+archive/ubuntu/obd-tui/+packages>."
          } >> "$GITHUB_STEP_SUMMARY"
