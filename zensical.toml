# Zensical site config. Built with `uv run zensical build --clean` and
# deployed to GitHub Pages by the `docs` job of the ci workflow. The
# `zensical` dependency lives in the [dependency-groups].doc group.

[project]
site_name = "obd-tui"
site_description = "Terminal dashboard for real-time OBD-II vehicle diagnostics"
site_author = "Chris"
site_url = "https://goabonga.github.io/obd-tui/"
repo_url = "https://github.com/goabonga/obd-tui"
repo_name = "goabonga/obd-tui"

# No [project.markdown_extensions] table on purpose: Zensical reads that
# key with `config.get(key, DEFAULT_MARKDOWN_EXTENSIONS)`, a fallback
# rather than a merge, so declaring a single extension replaces the whole
# default set — superfences and highlight included, which turns every
# fenced code block into inline code with no warning. Adding one means
# restating all of them.

# Navigation tree for the published site (files live under docs/).
nav = [
    { "Introduction" = "index.md" },
    { "Usage" = "usage.md" },
    { "Panels" = "panels.md" },
    { "Architecture" = "architecture.md" },
    { "Stability & deprecation" = "stability.md" },
]

# Footer. `copyright` renders in the highlighted slot of
# `partials/copyright.html`, above the theme's own attribution line;
# `extra.generator = false` is the switch that partial reads to drop
# that line, leaving this as the only footer text. Raw HTML, not
# Markdown - the value is interpolated into the template as-is.
copyright = """
Made with <span style="color: #e25555;">&#10084;</span> by
<a href="https://github.com/goabonga" target="_blank" rel="noopener">goabonga</a>
"""

[project.extra]
generator = false

# Branding. Both files are generated from `assets/obd-tui.svg` by
# `scripts/regen-icons.sh` and committed: the docs job builds the site
# from the checked-in tree and never installs the `favicon` dep group.
# Paths resolve relative to the docs dir.
[project.theme]
logo = "obd-tui.svg"
favicon = "favicon.ico"

# Dark first. Neither entry declares `media`, so the OS
# `prefers-color-scheme` is ignored and every visitor lands on the first
# one - slate - whatever their system is set to. The toggle in the
# header switches to the next entry and the theme persists that choice
# in localStorage, so the pin only decides the *first* visit.
#
# Green matches the logo, which is the app's own palette: the dashboard
# is green on black. Without an explicit `primary`/`accent` the palette
# partial falls back to indigo, which clashes with it.
[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "light green"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "light green"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }
