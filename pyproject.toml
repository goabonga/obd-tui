[project]
name = "obd-tui"
version = "0.3.2"
description = "Terminal dashboard for real-time OBD-II vehicle diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["obd", "obd-ii", "elm327", "automotive", "diagnostics", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Terminals",
]
dependencies = [
    "obd>=0.7.3",
    "platformdirs>=2.6",
    "pyserial>=3.5",
    "textual>=8.0.1",
]

[project.scripts]
obd-tui = "obd_tui.cli:main"

[project.urls]
Homepage = "https://github.com/goabonga/obd-tui"
Documentation = "https://goabonga.github.io/obd-tui/"
Repository = "https://github.com/goabonga/obd-tui"
Issues = "https://github.com/goabonga/obd-tui/issues"
Changelog = "https://github.com/goabonga/obd-tui/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_tui"]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.13",
    "types-pyserial>=3.5",
]
doc = [
    "zensical",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=obd_tui",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["src/obd_tui"]

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests"]
