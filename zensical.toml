# Zensical site config. Built with `uv run zensical build --clean` and
# deployed to GitHub Pages by the `docs` job of the ci workflow. The
# `zensical` dependency lives in the [dependency-groups].doc group.

[project]
site_name = "obd-tui"
site_description = "Terminal dashboard for real-time OBD-II vehicle diagnostics"
site_author = "Chris"
site_url = "https://goabonga.github.io/obd-tui/"
repo_url = "https://github.com/goabonga/obd-tui"
repo_name = "goabonga/obd-tui"

# No [project.markdown_extensions] table on purpose: Zensical reads that
# key with `config.get(key, DEFAULT_MARKDOWN_EXTENSIONS)`, a fallback
# rather than a merge, so declaring a single extension replaces the whole
# default set — superfences and highlight included, which turns every
# fenced code block into inline code with no warning. Adding one means
# restating all of them.

# Navigation tree for the published site (files live under docs/).
nav = [
    { "Introduction" = "index.md" },
    { "Usage" = "usage.md" },
    { "Panels" = "panels.md" },
    { "Architecture" = "architecture.md" },
    { "Stability & deprecation" = "stability.md" },
]

# Branding. Both files are generated from `assets/obd-tui.svg` by
# `scripts/regen-icons.sh` and committed: the docs job builds the site
# from the checked-in tree and never installs the `favicon` dep group.
# Paths resolve relative to the docs dir.
[project.theme]
logo = "obd-tui.svg"
favicon = "favicon.ico"
